name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up repository SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Validate release contract
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Validate-Release.ps1 -Tag $env:RELEASE_TAG -FirstPublicRelease

      - name: Restore
        run: dotnet restore KeelMatrix.ShutdownSpec.sln --configfile NuGet.config

      - name: Build shipping project
        run: dotnet build src/KeelMatrix.ShutdownSpec/KeelMatrix.ShutdownSpec.csproj --configuration Release --no-restore --warnaserror

      - name: Run Release test suite
        run: dotnet test KeelMatrix.ShutdownSpec.sln --configuration Release --no-restore

      - name: Pack exact release artifacts
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $tagMatch = [regex]::Match($tag, '^v(?<version>\d+\.\d+\.\d+)$')
          if (-not $tagMatch.Success) { throw "Release tag is not a stable vX.Y.Z tag: $tag" }

          $version = $tagMatch.Groups['version'].Value
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          if (Test-Path -LiteralPath $artifactRoot) {
              Remove-Item -LiteralPath $artifactRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $artifactRoot | Out-Null

          dotnet pack src/KeelMatrix.ShutdownSpec/KeelMatrix.ShutdownSpec.csproj --configuration Release --no-restore --output $artifactRoot
          if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed with exit code $LASTEXITCODE." }

          $expected = @(
              "KeelMatrix.ShutdownSpec.$version.nupkg",
              "KeelMatrix.ShutdownSpec.$version.snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath $artifactRoot -File | ForEach-Object Name | Sort-Object)
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($null -ne $difference) {
              throw "Release artifact set mismatch. Expected: $($expected -join ', '); actual: $($actual -join ', ')."
          }
          Write-Host "Exact release artifact set: $($actual -join ', ')"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: artifacts/release
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish exact artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up repository SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: release-packages

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: dmitriyzen

      - name: Publish exact artifact set
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $tag = $env:RELEASE_TAG
          $tagMatch = [regex]::Match($tag, '^v(?<version>\d+\.\d+\.\d+)$')
          if (-not $tagMatch.Success) { throw "Release tag is not a stable vX.Y.Z tag: $tag" }

          $version = $tagMatch.Groups['version'].Value
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'release-packages'
          $expected = @(
              "KeelMatrix.ShutdownSpec.$version.nupkg",
              "KeelMatrix.ShutdownSpec.$version.snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath $artifactRoot -File | ForEach-Object Name | Sort-Object)
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($null -ne $difference) {
              throw "Downloaded artifact set mismatch. Expected: $($expected -join ', '); actual: $($actual -join ', ')."
          }

          foreach ($artifactName in $expected) {
              dotnet nuget push (Join-Path $artifactRoot $artifactName) --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
              if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $artifactName with exit code $LASTEXITCODE." }
          }
