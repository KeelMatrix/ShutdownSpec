name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up repository SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KeelMatrix.ShutdownSpec.sln --configfile NuGet.config

      - name: Build shipping project
        run: dotnet build src/KeelMatrix.ShutdownSpec/KeelMatrix.ShutdownSpec.csproj --configuration Release --no-restore --warnaserror

      - name: Run Release test suite
        run: dotnet test KeelMatrix.ShutdownSpec.sln --configuration Release --no-restore

      - name: Run Release package gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-PackageGate.ps1 -Configuration Release -ReleaseReadiness

      - name: Run bounded lifecycle stress fixture
        run: dotnet run --project tests/Stress/ShutdownSpec.Stress.Net8.csproj --configuration Release -- --iterations 3000 --max-seconds 120
