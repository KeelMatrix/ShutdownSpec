name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up repository SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Set up stress comparison SDK
        if: matrix.os != 'macos-latest'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: tests/Stress/global.json

      - name: Restore
        run: dotnet restore KeelMatrix.ShutdownSpec.sln --configfile NuGet.config

      - name: Build shipping project
        run: dotnet build src/KeelMatrix.ShutdownSpec/KeelMatrix.ShutdownSpec.csproj --configuration Release --no-restore --warnaserror

      - name: Run Release test suite
        shell: pwsh
        run: |
          dotnet test KeelMatrix.ShutdownSpec.sln --configuration Release --no-restore --logger trx
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $failedResults = @(
              Get-ChildItem -Path . -Recurse -Filter *.trx -File |
                ForEach-Object {
                  [xml]$trx = Get-Content -LiteralPath $_.FullName
                  $trx.TestRun.Results.UnitTestResult | Where-Object Outcome -eq 'Failed'
                }
            )
            if ($failedResults.Count -eq 0) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Release test suite failed, but no failed TRX result was found.'
            }
            foreach ($failed in $failedResults) {
              $message = $failed.Output.ErrorInfo.Message
              if ([string]::IsNullOrWhiteSpace($message)) { $message = 'No failure message was recorded.' }
              $summary = "- **$($failed.testName)**: $message"
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
              Write-Output "::error title=Release test failure::$($failed.testName): $message"
            }
          }
          exit $testExitCode

      - name: Run Release package gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-PackageGate.ps1 -Configuration Release -ReleaseReadiness

      - name: Run bounded lifecycle stress fixture
        if: matrix.os != 'macos-latest'
        run: dotnet run --project tests/Stress/ShutdownSpec.Stress.Net8.csproj --configuration Release -- --iterations 1000 --max-seconds 300

      - name: Run .NET 10 lifecycle stress comparison
        if: matrix.os != 'macos-latest'
        working-directory: tests/Stress
        run: dotnet run --project ShutdownSpec.Stress.csproj --configuration Release --framework net10.0 -- --iterations 1000 --max-seconds 300

      - name: Run .NET 8 hosting compatibility fixture
        if: matrix.os != 'macos-latest'
        run: dotnet run --project tests/Stress/HostingCompatibility/Net8/ShutdownSpec.HostingCompatibility.Net8.csproj --configuration Release

      - name: Run .NET 10 hosting compatibility fixture
        if: matrix.os != 'macos-latest'
        working-directory: tests/Stress
        run: dotnet run --project HostingCompatibility/Net10/ShutdownSpec.HostingCompatibility.Net10.csproj --configuration Release
